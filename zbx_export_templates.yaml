zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 3dc0083aaafc412dbb6a8b6df113331d
      name: 'CCOSS 2026/ccoss96'
  templates:
    - uuid: e2cbd6ab2f3443e088c67622a61de039
      template: 'Open-Meteo by HTTP - ccoss60'
      name: 'Open-Meteo by HTTP - ccoss60'
      description: 'Monitors current weather conditions using the Open-Meteo API.'
      groups:
        - name: 'CCOSS 2026/ccoss96'
      items:
        - uuid: dc0a4b44b59641fe8cd6d51293767a4f
          name: 'Weather: Get current conditions'
          type: HTTP_AGENT
          key: openmeteo.current.get
          delay: 15m
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Master item: raw JSON with the current conditions from the Open-Meteo API.'
          url: 'https://api.open-meteo.com/v1/forecast'
          query_fields:
            - name: latitude
              value: '{$OPENMETEO.LATITUDE}'
            - name: longitude
              value: '{$OPENMETEO.LONGITUDE}'
            - name: current
              value: 'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,uv_index'
            - name: timezone
              value: auto
          tags:
            - tag: component
              value: raw
        - uuid: 26860a77831d4a6890c5692467f3f179
          name: 'Weather: Relative humidity'
          type: DEPENDENT
          key: openmeteo.humidity
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'Relative humidity at 2 meters above ground, in %.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.current.relative_humidity_2m
          master_item:
            key: openmeteo.current.get
          tags:
            - tag: component
              value: environment
        - uuid: 4405b473b4d947efa61daa3d1d6b9185
          name: 'Weather: Temperature11'
          type: DEPENDENT
          key: openmeteo.temperature
          delay: '0'
          value_type: FLOAT
          units: °C
          description: 'Air temperature at 2 meters above ground.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.current.temperature_2m
          master_item:
            key: openmeteo.current.get
          tags:
            - tag: component
              value: environment
        - uuid: 3c93e43ada774572a9bf4dc6aab769e5
          name: 'Weather: Apparent temperature'
          type: DEPENDENT
          key: openmeteo.temperature.apparent
          delay: '0'
          value_type: FLOAT
          units: °C
          description: 'Apparent ("feels like") temperature, combining air temperature, humidity and wind.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.current.apparent_temperature
          master_item:
            key: openmeteo.current.get
          tags:
            - tag: component
              value: environment
          triggers:
            - uuid: f8fb0365cf694dc88fb957e94dd58321
              expression: 'min(/Open-Meteo by HTTP - ccoss60/openmeteo.temperature.apparent,30m)>{$OPENMETEO.TEMP.APPARENT.MAX.WARN}'
              name: 'Weather: High apparent temperature'
              event_name: 'Weather: High apparent temperature (over {$OPENMETEO.TEMP.APPARENT.MAX.WARN}°C for 30m)'
              opdata: 'Feels like: {ITEM.LASTVALUE1}'
              priority: WARNING
              tags:
                - tag: scope
                  value: notice
        - uuid: 8ed6ce4af3bd445b8918903bef6601cf
          name: 'Weather: Weather condition'
          type: DEPENDENT
          key: openmeteo.weather.code
          delay: '0'
          description: 'Current weather condition as a WMO weather code.'
          valuemap:
            name: 'WMO weather code'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.current.weather_code
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          master_item:
            key: openmeteo.current.get
          tags:
            - tag: component
              value: environment
        - uuid: 913a840da6c847b784777ea6473588c6
          name: 'Weather: Wind speed'
          type: DEPENDENT
          key: openmeteo.wind.speed
          delay: '0'
          value_type: FLOAT
          units: km/h
          description: 'Wind speed at 10 meters above ground, in km/h.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.current.wind_speed_10m
          master_item:
            key: openmeteo.current.get
          tags:
            - tag: component
              value: environment
          triggers:
            - uuid: 798daed4075b48aeb02a963485da9d32
              expression: 'min(/Open-Meteo by HTTP - ccoss60/openmeteo.wind.speed,30m)>{$OPENMETEO.WIND.SPEED.MAX.WARN}'
              name: 'Weather: Strong wind'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: notice
      tags:
        - tag: class
          value: software
        - tag: target
          value: open-meteo
      macros:
        - macro: '{$OPENMETEO.LATITUDE}'
          value: '20.97'
          description: 'Latitude of the monitored location.'
        - macro: '{$OPENMETEO.LONGITUDE}'
          value: '-89.62'
          description: 'Longitude of the monitored location.'
        - macro: '{$OPENMETEO.TEMP.APPARENT.MAX.WARN}'
          value: '40'
          description: 'Warning threshold of the apparent temperature, in °C.'
        - macro: '{$OPENMETEO.WIND.SPEED.MAX.WARN}'
          value: '50'
          description: 'Warning threshold of the wind speed, in km/h.'
      valuemaps:
        - uuid: 41fa93036bc1441a8e60d637dbb2d3d1
          name: 'WMO weather code'
          mappings:
            - value: '0'
              newvalue: 'Clear sky'
            - value: '1'
              newvalue: 'Mainly clear'
            - value: '2'
              newvalue: 'Partly cloudy'
            - value: '3'
              newvalue: Overcast
            - value: '61'
              newvalue: 'Slight rain'
            - value: '63'
              newvalue: 'Moderate rain'
            - value: '65'
              newvalue: 'Heavy rain'
            - value: '95'
              newvalue: Thunderstorm
